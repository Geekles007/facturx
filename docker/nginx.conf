# Adresse du visiteur amputée de son dernier octet avant d'être écrite : le journal analysé par
# GoAccess ne contient donc jamais d'adresse complète, et il n'y a rien à purger pour autant.
# Conséquence assumée : deux visiteurs d'un même /24 comptent pour un seul.
map $remote_addr $ip_anonyme {
    ~^(?<prefixe>\d+\.\d+\.\d+)\.    "$prefixe.0";
    ~^(?<prefixe>[^:]+:[^:]+):       "$prefixe::";
    default                          "0.0.0.0";
}

log_format anonyme '$ip_anonyme - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Derrière un proxy (Traefik chez Coolify) : ne jamais renvoyer l'hôte interne dans un Location.
    absolute_redirect off;

    # Derrière ce même proxy, $remote_addr vaut l'adresse du proxy pour toutes les requêtes.
    # Sans ces lignes, le journal — et donc GoAccess — ne verrait qu'un seul visiteur.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Sortie standard : journal d'exploitation, éphémère, lu dans Coolify.
    access_log /dev/stdout main;
    # Fichier : la matière de GoAccess, conservée, sans adresse complète.
    access_log /var/log/nginx/access.log anonyme;

    # Sans la barre finale, les chemins relatifs de la page remonteraient d'un cran.
    location = /validateur { return 301 /validateur/; }
    location = /en { return 301 /en/; }
    location = /en/validateur { return 301 /en/validateur/; }
    location = /stats { return 301 /stats/; }

    # Rapport GoAccess : servi seulement si STATS_PASSWORD est défini (voir docker/entrypoint.sh).
    include /etc/nginx/stats.conf;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/xml application/json image/svg+xml text/plain;

    # Ressources au contenu figé : le nom change quand le contenu change.
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /validateur/vendor/ {
        add_header Cache-Control "public, max-age=31536000";
    }
    location /validateur/schemas/ {
        add_header Cache-Control "public, max-age=31536000";
    }

    # Relevé des téléchargements npm : refait à chaque construction, donc jamais gardé longtemps.
    location = /npm-downloads.json {
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
