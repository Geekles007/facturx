server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Derrière un proxy (Traefik chez Coolify) : ne jamais renvoyer l'hôte interne dans un Location.
    absolute_redirect off;

    # Sans la barre finale, les chemins relatifs de la page remonteraient d'un cran.
    location = /validateur { return 301 /validateur/; }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/xml application/json image/svg+xml text/plain;

    # Ressources au contenu figé : le nom change quand le contenu change.
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /validateur/vendor/ {
        add_header Cache-Control "public, max-age=31536000";
    }
    location /validateur/schemas/ {
        add_header Cache-Control "public, max-age=31536000";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
