name: Release

# Déclenché par un tag vX.Y.Z (voir docs/release.md).
# Publie sur npm par trusted publishing (OIDC, sans secret) avec attestation de provenance,
# puis crée la release GitHub avec les notes du CHANGELOG.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # release GitHub
  id-token: write # trusted publishing npm + provenance

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: npm ≥ 11.5 (requis pour le trusted publishing)
        run: npm install -g npm@latest && npm --version
      - run: pnpm install --frozen-lockfile
      - name: Schémas et schematrons officiels (cache par commit épinglé)
        uses: actions/cache@v4
        with:
          path: packages/facturx/test/schemas
          key: schemas-${{ hashFiles('scripts/fetch-schemas.mjs') }}
      - run: pnpm schemas:fetch
      - name: veraPDF (shim Docker) dans le PATH
        run: |
          docker pull --quiet ghcr.io/verapdf/cli:latest
          echo "$GITHUB_WORKSPACE/scripts" >> "$GITHUB_PATH"
      - name: Vérifications complètes
        run: pnpm check
      - name: Garde-fous de version
        run: node scripts/release-check.mjs "$GITHUB_REF_NAME"
      - name: Publication npm (trusted publishing OIDC)
        working-directory: packages/facturx
        # loglevel verbose : les échecs d'échange OIDC ne sont visibles qu'à ce niveau ; pipefail pour ne pas masquer un échec de npm
        run: |
          set -o pipefail
          npm publish --access public --provenance --loglevel verbose 2>&1 | grep -vE "^npm (verbose|http) (title|argv|logfile|cli|node|npm|shrinkwrap|dry-run)"
      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
