name: Image du site

# L'image du site n'était jusqu'ici construite que par Coolify, au déploiement : une erreur de
# configuration nginx ne se voyait donc qu'en production. Ce contrôle la rattrape avant.
# Limité aux chemins qui la composent : inutile de reconstruire une image à chaque commit du SDK.
# `site/**` en fait partie : la CSP interdit les scripts en ligne, et une page qui en reprendrait un
# resterait muette en production sans qu'aucun autre contrôle ne le voie.
on:
  push:
    paths:
      - Dockerfile
      - docker/**
      - site/**
      - .dockerignore
      - .github/workflows/image.yml
  pull_request:
    paths:
      - Dockerfile
      - docker/**
      - site/**
      - .dockerignore
      - .github/workflows/image.yml

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Contient « nginx -t » : une configuration invalide fait échouer la construction ici.
      - name: Construire
        run: docker build -t facturx-site .

      - name: Démarrer, statistiques activées
        run: |
          docker run -d --name site -e STATS_PASSWORD=motdepassedetest -p 8080:80 facturx-site
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:8080/ && break
            sleep 1
          done
          docker logs site

      - name: Le site répond
        run: |
          curl -fsS -o /dev/null http://localhost:8080/
          curl -fsS -o /dev/null http://localhost:8080/validateur/

      # nginx n'hérite d'aucun add_header du niveau server dans une location qui en définit un : la CSP
      # est donc incluse dans chacune, et il faut un chemin par location pour le voir. Toutes les
      # réponses disent la même politique.
      - name: Chaque réponse du site porte la CSP, quelle que soit la location qui la sert
        run: |
          reference=""
          for chemin in \
              / /en/ /validateur/ /en/validateur/ /studio/ /en/studio/ /cgu/ /en/confidentialite/ \
              /fonts/Geist-Variable.woff2 \
              /studio/polices/geist-regular.ttf \
              /validateur/vendor/SaxonJS2.rt.js \
              /validateur/schemas/v1.4.0.04/FACTUR-X_EN16931.sef.json.gz \
              /npm-downloads.json \
              /validateur/compteur/controle /studio/compteur/facture; do
            entetes=$(curl -sI "http://localhost:8080$chemin" | tr -d '\r')
            statut=$(printf '%s\n' "$entetes" | head -1)
            case "$chemin:$statut" in
              # Le relevé npm n'est pas écrit quand l'API était indisponible à la construction : la
              # location répond alors 404, avec sa CSP, et c'est la CSP que l'on regarde ici.
              /npm-downloads.json:*) ;;
              *:*' 2'[0-9][0-9]*) ;;
              *) echo "$chemin : réponse inattendue « $statut »"; exit 1 ;;
            esac
            csp=$(printf '%s\n' "$entetes" | grep -i '^content-security-policy:' || true)
            [ -n "$csp" ] || { echo "$chemin : pas d'en-tête content-security-policy"; exit 1; }
            [ "$(printf '%s\n' "$csp" | wc -l)" -eq 1 ] \
              || { echo "$chemin : content-security-policy en double"; exit 1; }
            reference="${reference:-$csp}"
            [ "$csp" = "$reference" ] || { echo "$chemin : CSP différente de celle de /"; exit 1; }
            echo "$chemin : CSP présente"
          done
          echo "$reference"
          # Ce qui compte dans la politique : aucun script hors du site, ni en ligne ni par eval,
          # aucun plugin, aucune base ou cadre étranger, et le site seul pour connect-src (cette
          # image est construite sans projet Supabase ; l'origine d'un projet est vérifiée plus bas).
          for jeton in "script-src 'self';" "object-src 'none';" "base-uri 'self';" \
              "frame-ancestors 'none'" "connect-src 'self';"; do
            case "$reference" in
              *"$jeton"*) ;;
              *) echo "CSP : « $jeton » absent"; exit 1 ;;
            esac
          done
          case "$reference" in
            *unsafe-eval*|*'${'*) echo "CSP : jeton interdit, ou gabarit non substitué"; exit 1 ;;
          esac

      # L'URL du projet est un argument de construction, gravé dans le bundle du Studio : la CSP
      # l'est aussi, par docker/ecrire-csp.sh, pour que les deux disent la même origine. On essaie
      # le script dans l'image plutôt que de la reconstruire pour chaque cas.
      - name: L'origine du projet Supabase entre dans connect-src, et rien d'autre
        run: |
          csp() {
            docker run --rm --entrypoint /usr/local/bin/ecrire-csp.sh facturx-site \
              "$1" /etc/nginx/csp.gabarit /dev/stdout | grep -o 'connect-src[^;]*;'
          }
          attendu() {
            obtenu=$(csp "$1")
            [ "$obtenu" = "$2" ] || { echo "« $1 » : attendu « $2 », reçu « $obtenu »"; exit 1; }
          }
          attendu '' "connect-src 'self';"
          attendu 'https://abcdefgh.supabase.co' "connect-src 'self' https://abcdefgh.supabase.co;"
          attendu 'https://abcdefgh.supabase.co/' "connect-src 'self' https://abcdefgh.supabase.co;"
          attendu 'http://127.0.0.1:55421' "connect-src 'self' http://127.0.0.1:55421;"
          # Une valeur qui n'est pas une origine ajouterait une directive à l'en-tête : la
          # construction s'arrête plutôt que de publier une politique qu'on n'a pas écrite.
          for mauvaise in "https://x.supabase.co; script-src *" "https://x.supabase.co/rest/v1" \
              "supabase.co" "javascript:alert(1)" "https://x y.co"; do
            if docker run --rm --entrypoint /usr/local/bin/ecrire-csp.sh facturx-site \
                "$mauvaise" /etc/nginx/csp.gabarit /dev/null 2>/dev/null; then
              echo "« $mauvaise » aurait dû être refusée"
              exit 1
            fi
          done

      # Un script en ligne serait bloqué par `script-src 'self'` : la page resterait muette sans que
      # rien ne le dise. On le cherche donc dans le HTML servi, de même qu'un gestionnaire
      # d'événement (on…=) ou une adresse javascript:, bloqués de la même façon.
      - name: Aucune page ne porte de script en ligne
        run: |
          for page in / /en/ /validateur/ /en/validateur/ /studio/ /en/studio/ \
              /cgu/ /confidentialite/ /sous-traitance/ \
              /en/cgu/ /en/confidentialite/ /en/sous-traitance/; do
            html=$(curl -fsS "http://localhost:8080$page")
            if printf '%s\n' "$html" | grep -i '<script' | grep -ivq 'src='; then
              echo "$page : script en ligne"; exit 1
            fi
            if printf '%s\n' "$html" | grep -Eiq '<[^>]*[[:space:]]on[a-z]+=|javascript:'; then
              echo "$page : gestionnaire d'événement ou adresse javascript:"; exit 1
            fi
          done

      # Les CGU sont le lien de la boîte de création de compte : une page absente de l'image serait
      # un lien mort au moment où l'utilisateur doit les accepter. Les adresses sans barre finale
      # redirigent, sans quoi les chemins relatifs de la page remonteraient d'un cran.
      - name: Les textes juridiques sont servis, avec ou sans barre finale
        run: |
          for chemin in /cgu /confidentialite /sous-traitance; do
            for langue in "" /en; do
              curl -fsS -o /dev/null "http://localhost:8080$langue$chemin/"
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$langue$chemin")
              [ "$code" = "301" ] || { echo "$langue$chemin : attendu 301, reçu $code"; exit 1; }
            done
          done

      - name: /stats/ est fermé sans mot de passe
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/stats/)
          [ "$code" = "401" ] || { echo "attendu 401, reçu $code"; exit 1; }

      - name: /stats/ s'ouvre avec le mot de passe
        run: |
          curl -fsS -u stats:motdepassedetest -o /dev/null http://localhost:8080/stats/

      - name: La page des compteurs existe dès le démarrage, derrière le mot de passe
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/stats/compteurs.html)
          [ "$code" = "401" ] || { echo "attendu 401, reçu $code"; exit 1; }
          # Générée au démarrage, avant toute requête : rien n'est encore compté.
          curl -fsS -u stats:motdepassedetest http://localhost:8080/stats/compteurs.html >/tmp/compteurs.html
          grep -q 'Aucun décompte enregistré' /tmp/compteurs.html

      # Le rapport de GoAccess repose sur des scripts et des styles en ligne : la CSP du site le
      # rendrait muet. Il est derrière son mot de passe, et n'est pas une page du site.
      - name: /stats/ n'a pas la CSP du site
        run: |
          for chemin in /stats/ /stats/compteurs.html /stats/rapport.js; do
            entetes=$(curl -sI -u stats:motdepassedetest "http://localhost:8080$chemin" | tr -d '\r')
            printf '%s\n' "$entetes" | head -1 | grep -q ' 200' \
              || { echo "$chemin : attendu 200"; printf '%s\n' "$entetes"; exit 1; }
            if printf '%s\n' "$entetes" | grep -iq '^content-security-policy:'; then
              echo "$chemin : la CSP du site ne doit pas s'y appliquer"; exit 1
            fi
          done

      - name: Le rapport contient les visites, et pas d'adresse complète
        run: |
          for i in $(seq 1 5); do curl -fsS -o /dev/null http://localhost:8080/; done
          docker exec site /usr/local/bin/goaccess-report.sh
          curl -fsS -u stats:motdepassedetest http://localhost:8080/stats/ >/tmp/rapport.html
          # Le rapport de repli s'affiche quand le journal est vide : ce n'est pas ce qu'on veut ici.
          if grep -q 'Aucune visite enregistrée' /tmp/rapport.html; then
            echo "GoAccess n'a rien analysé : rapport de repli servi"
            exit 1
          fi
          grep -q 'facturx.ibird.dev' /tmp/rapport.html
          echo "— journal analysé par GoAccess —"
          docker exec site head -3 /var/log/nginx/access.log
          # Toutes les adresses du journal doivent finir par .0 (ou ::) : anonymisées à l'écriture.
          docker exec site sh -c 'cut -d" " -f1 /var/log/nginx/access.log | sort -u' >/tmp/ips
          cat /tmp/ips
          if grep -qvE '(\.0|::)$' /tmp/ips; then
            echo "adresse non anonymisée dans le journal"
            exit 1
          fi
          echo "toutes les adresses sont tronquées"

      - name: La page des compteurs compte jour par jour, comme le rapport
        run: |
          navigateur='Mozilla/5.0 (X11; Linux x86_64; rv:131.0) Gecko/20100101 Firefox/131.0'
          for i in 1 2 3; do
            curl -fsS -A "$navigateur" -o /dev/null http://localhost:8080/studio/compteur/facture
          done
          for i in 1 2; do
            curl -fsS -A "$navigateur" -o /dev/null http://localhost:8080/validateur/compteur/controle
          done
          # Ni un robot ni une requête HEAD ne comptent : le rapport principal les écarte aussi.
          curl -fsS -A 'Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)' \
            -o /dev/null http://localhost:8080/studio/compteur/facture
          curl -fsS -I -A "$navigateur" -o /dev/null http://localhost:8080/studio/compteur/facture
          docker exec site /usr/local/bin/goaccess-report.sh
          curl -fsS -u stats:motdepassedetest http://localhost:8080/stats/compteurs.html >/tmp/compteurs.html
          grep -o '<tr data-[a-z]*="[^"]*"[^>]*>' /tmp/compteurs.html
          grep -q '<tr data-periode="tout" data-studio="3" data-validateur="2">' /tmp/compteurs.html
          # Additionnés, les jours redonnent le total. Pas de jour imposé : à minuit, les requêtes
          # peuvent tomber de part et d'autre, la somme ne bouge pas.
          somme=$(grep -o 'data-jour="[0-9]*" data-studio="[0-9]*" data-validateur="[0-9]*"' /tmp/compteurs.html \
            | awk -F'"' '{ s += $4; v += $6 } END { print s + 0, v + 0 }')
          [ "$somme" = "3 2" ] || { echo "jours : attendu « 3 2 », reçu « $somme »"; exit 1; }
          # Le rapport complet mène à la page.
          curl -fsS -u stats:motdepassedetest http://localhost:8080/stats/ >/tmp/rapport.html
          grep -q "src='rapport.js'" /tmp/rapport.html
          curl -fsS -u stats:motdepassedetest http://localhost:8080/stats/rapport.js >/tmp/rapport.js
          grep -q 'compteurs.html' /tmp/rapport.js

      - name: Sans mot de passe, /stats/ n'existe pas
        run: |
          docker rm -f site >/dev/null
          docker run -d --name nu -p 8081:80 facturx-site
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:8081/ && break
            sleep 1
          done
          for chemin in /stats/ /stats/compteurs.html; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8081$chemin")
            [ "$code" = "404" ] || { echo "$chemin : attendu 404, reçu $code"; exit 1; }
          done
          docker logs nu
