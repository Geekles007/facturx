name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Schémas et schematrons officiels (cache par commit épinglé)
        uses: actions/cache@v6
        with:
          path: packages/facturx/test/schemas
          key: schemas-${{ hashFiles('scripts/fetch-schemas.mjs') }}
      - run: pnpm schemas:fetch
      - name: Fichiers tiers (cache par commits épinglés)
        uses: actions/cache@v6
        with:
          path: packages/facturx/test/samples
          key: samples-${{ hashFiles('scripts/fetch-samples.mjs') }}
      - run: pnpm samples:fetch
      - name: xmllint (validation XSD)
        # L'index apt de l'image peut désigner une version déjà retirée du miroir (404) : on le
        # rafraîchit avant d'installer.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libxml2-utils >/dev/null
      - name: veraPDF (shim Docker) dans le PATH
        run: |
          docker pull --quiet ghcr.io/verapdf/cli:latest
          echo "$GITHUB_WORKSPACE/scripts" >> "$GITHUB_PATH"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Validateur en ligne (types, tests, bundle)
        run: pnpm site:check
      - run: pnpm examples:check

  # Le compte : les tests pgTAP (supabase/tests) et ceux des Edge Functions (supabase/functions/tests)
  # contre une pile Supabase locale. Node 24 seulement : la matrice du job `ci` éprouve déjà le SDK.
  compte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: CLI Supabase
        # `@v1` installe le CLI 2.20.3 sans `version` ; on épingle celui avec lequel config.toml a été écrit.
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - uses: denoland/setup-deno@v2
      - name: veraPDF (shim Docker) dans le PATH
        run: |
          docker pull --quiet ghcr.io/verapdf/cli:latest
          echo "$GITHUB_WORKSPACE/scripts" >> "$GITHUB_PATH"
      - name: Pile Supabase locale (sans les services inutiles aux tests)
        run: supabase start -x studio,imgproxy,vector,logflare,supavisor
      - name: SDK, Studio et modules partagés des fonctions
        run: pnpm build && pnpm site:build && pnpm compte:preparer
      - name: Tests du Studio contre la pile (persistance du compte)
        # L'adresse et les clés de la pile viennent de `supabase status`, masquées avant tout usage :
        # aucune n'apparaît dans le journal. Sans elles, les tests seraient sautés : l'étape échoue.
        run: |
          while IFS='=' read -r nom valeur; do
            valeur="${valeur%\"}"
            valeur="${valeur#\"}"
            case "$nom" in
              API_URL) export SUPABASE_URL="$valeur" ;;
              ANON_KEY) echo "::add-mask::$valeur"; export SUPABASE_ANON_KEY="$valeur" ;;
              SERVICE_ROLE_KEY) echo "::add-mask::$valeur"; export SUPABASE_SERVICE_ROLE_KEY="$valeur" ;;
            esac
          done < <(supabase status -o env)
          : "${SUPABASE_URL:?}" "${SUPABASE_ANON_KEY:?}" "${SUPABASE_SERVICE_ROLE_KEY:?}"
          pnpm exec vitest run --config vitest.site.config.mts site-src/studio/compte
      - name: Tests de la base et des fonctions (le PDF émis passe veraPDF), émissions réelles du Studio
        # `compte:test` sert les fonctions, puis y lance aussi les émissions réelles du Studio
        # (emission-pile.test.ts, FACTURX_EMETTRE=1), sautées à l'étape précédente.
        run: pnpm compte:test
        env:
          VERAPDF: '1'
