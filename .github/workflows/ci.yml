name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Schémas et schematrons officiels (cache par commit épinglé)
        uses: actions/cache@v6
        with:
          path: packages/facturx/test/schemas
          key: schemas-${{ hashFiles('scripts/fetch-schemas.mjs') }}
      - run: pnpm schemas:fetch
      - name: Fichiers tiers (cache par commits épinglés)
        uses: actions/cache@v6
        with:
          path: packages/facturx/test/samples
          key: samples-${{ hashFiles('scripts/fetch-samples.mjs') }}
      - run: pnpm samples:fetch
      - name: xmllint (validation XSD)
        run: sudo apt-get install -y --no-install-recommends libxml2-utils >/dev/null
      - name: veraPDF (shim Docker) dans le PATH
        run: |
          docker pull --quiet ghcr.io/verapdf/cli:latest
          echo "$GITHUB_WORKSPACE/scripts" >> "$GITHUB_PATH"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Validateur en ligne (types, tests, bundle)
        run: pnpm site:check
      - run: pnpm examples:check
